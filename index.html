<!doctype html>
<html lang="en">
  <head>
    <!-- Meta data -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <meta name="keywords" content="" />

    <!-- Title in web tab -->
    <title>Amazon</title>

    <!-- Font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Links css file -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header Section -->
    <header class="header">
      <!-- main bar -->
      <section class="main-bar">
        <!-- logo -->
        <div class="logo">
          <img src="Amazon-Emblem.jpg" alt="Amazon Logo" />
        </div>

        <!-- location -->
        <div class="location">
          <i class="fa-solid fa-location-dot"></i>
          <p>Deliver to <br /><span>Jordan</span></p>
        </div>

        <!-- search bar -->
        <section class="search-bar">
          <div class="search">
            <datalist></datalist>
          </div>
        </section>

        <!-- language section -->
        <section class="language"></section>

        <!-- account section -->
        <section class="account"></section>

        <!-- orders section -->
        <section class="orders"></section>

        <!-- cart section -->
        <section class="cart"></section>
      </section>

      <!-- nav shop -->
      <nav class="nav-shop">
        <ul class="nav-links">
          <li class="links">
            <a href=""><i class="fa-solid fa-bars"></i> All</a>
          </li>
          <li class="links"><a href="">Prime Video</a></li>
          <li class="links"><a href="">Coupons</a></li>
          <li class="links"><a href="">Customer Service</a></li>
          <li class="links"><a href="">Today's Deals</a></li>
          <li class="links"><a href="">Registry</a></li>
          <li class="links"><a href="">Gift Cards</a></li>
          <li class="links"><a href="">Sell</a></li>
        </ul>
      </nav>
    </header>

    <!-- main section -->
    <main>
      <!-- Cards -->
      <section class="cards">
        <div class="shop-cards">
          <img src="kitchen.jpg" alt="kitchen background" />
          <h3>Shop Kitchen<br />must-haves</h3>
        </div>
        <div class="shop-cards">
          <img src="all.jpg" alt="beauty picture background" />
          <h3>Shop all<br />things beauty</h3>
        </div>
        <div class="shop-cards">
          <img src="looking.jpg" alt="cloth picture background" />
          <h3>Start looking<br />sharp</h3>
        </div>
        <div class="shop-cards">
          <img src="toys.jpg" alt="toys picture background" />
          <h3>Toys for little<br />ones</h3>
        </div>
      </section>
    </main>
  </body>
</html>
